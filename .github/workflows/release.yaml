name: Create Release Pull Request

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up environment variables
        env:
          TZ: "Asia/Tokyo"
        run: |
          echo "PR_TITLE=Release $(date '+%Y-%m-%d %H:%M:%S') +09:00" >> $GITHUB_ENV

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.10"
          bundler-cache: true

      - name: Install git-pr-release
        run: gem install --no-document git-pr-release

      - name: Create a release pull request
        run: |
          set +e
          output=$(git-pr-release --squashed 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -q "No pull requests to be released"; then
            echo "No merged PRs to release yet. Skipping."
            exit 0
          fi
          exit $exit_code
        env:
          GIT_PR_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: main
          GIT_PR_RELEASE_BRANCH_STAGING: staging
          GIT_PR_RELEASE_LABELS: release
          GIT_PR_RELEASE_TEMPLATE: .github/RELEASE_PULL_REQUEST_TEMPLATE.md
